<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>修改步数</title>
</head>
<body>
    <div>
        <input type="text" id="username" placeholder="账号(邮箱/手机号)">
        <input type="password" id="password" placeholder="密码">
        <input type="number" id="step" placeholder="目标步数">
        <button id="run">执行</button>
        <pre id="output"></pre>
    </div>
<script>
document.getElementById('run').onclick = async ()=>{
    const payload = {
        USERNAME: document.getElementById('username').value,
        PASSWORD: document.getElementById('password').value,
        TARGET_STEP: Number(document.getElementById('step').value)
    }
    document.getElementById('output').innerText = "正在请求...";
    try{
        const res = await fetch("/api/step",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify(payload)
        })
        const data = await res.json();
        document.getElementById('output').innerText = JSON.stringify(data,null,2);
    }catch(err){
        document.getElementById('output').innerText = err.toString();
    }
}
</script>
</body>
</html>
